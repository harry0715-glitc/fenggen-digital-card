<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>楓根室內裝修設計有限公司｜LIFF 數位名片</title>
  <meta name="description" content="楓根室內裝修設計有限公司數位名片，可部署於 GitHub Pages，並可作為 LINE LIFF 頁面入口。" />
  <meta property="og:title" content="楓根室內裝修設計有限公司｜數位名片" />
  <meta property="og:description" content="黑金風格數位名片，可在 GitHub Pages 開啟，並支援後續 LIFF 整合。" />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --bg-1: #0c0c0d;
      --bg-2: #171414;
      --gold: #d4b071;
      --gold-soft: #f0dfb2;
      --ink: #f6ecd8;
      --ink-soft: rgba(246, 236, 216, 0.78);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
      --portrait-scale: 1;
      --portrait-y: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top, rgba(212,176,113,0.12), transparent 26%),
        radial-gradient(circle at bottom, rgba(212,176,113,0.08), transparent 28%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--ink);
    }

    body { padding: 14px; }

    .viewport {
      width: min(1180px, 100%);
      height: calc(100vh - 28px);
      margin: 0 auto;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(34,29,26,0.88), rgba(16,14,14,0.96));
      border: 1px solid rgba(212,176,113,0.16);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
      padding: 22px 18px 16px;
    }

    .viewport::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(212,176,113,0.06), transparent 18%, transparent 82%, rgba(212,176,113,0.06)),
        repeating-linear-gradient(0deg, rgba(212,176,113,0.02) 0 1px, transparent 1px 34px),
        repeating-linear-gradient(90deg, rgba(212,176,113,0.02) 0 1px, transparent 1px 34px);
      pointer-events: none;
    }

    .viewport > * { position: relative; z-index: 1; }

    .header {
      display: grid;
      gap: 0;
      justify-items: center;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.18;
      color: var(--gold-soft);
    }

    .service-row {
      display: inline-flex;
      align-items: center;
      justify-self: center;
      flex-wrap: wrap;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,176,113,0.14);
      color: var(--gold-soft);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .service-row .dot { color: var(--gold); }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .mobile-card {
      width: min(100%, 352px);
      max-height: none;
      border-radius: 30px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(35,30,28,0.98) 0%, rgba(18,17,17,0.98) 100%);
      border: 1px solid rgba(212,176,113,0.2);
      box-shadow: 0 18px 42px rgba(0,0,0,0.32);
      display: grid;
      grid-template-rows: auto auto auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      margin: 14px 14px 0;
      border-radius: 28px;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(212,176,113,0.14);
      background:
        radial-gradient(circle at 50% 0%, rgba(212,176,113,0.18), transparent 58%),
        linear-gradient(180deg, #1b1919 0%, #0f0f10 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      border: 1px solid rgba(212,176,113,0.08);
      pointer-events: none;
      z-index: 1;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      transform: translateY(var(--portrait-y)) scale(var(--portrait-scale));
      transform-origin: center top;
      filter: contrast(1.03) saturate(0.92) brightness(0.98);
    }

    .hero-copy {
      display: grid;
      gap: 6px;
      color: var(--ink);
    }

    .hero-copy .role {
      font-size: 15px;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(240,223,178,0.9);
    }

    .hero-copy .name {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--gold-soft);
    }

    .card-body {
      padding: 16px 18px 12px;
      display: grid;
      gap: 12px;
    }

    .info-list {
      display: grid;
      gap: 8px;
    }

    .info-item {
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 12px;
      align-items: start;
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-soft);
      padding: 7px 0;
      border-bottom: 1px solid rgba(212,176,113,0.08);
    }

    .info-item:last-child { border-bottom: 0; }

    .pill {
      width: 12px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #e0c184 0%, #9e7337 100%);
      box-shadow: 0 0 12px rgba(212,176,113,0.18);
      margin-top: 2px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      min-height: 42px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(180deg, #d7b26f 0%, #9d7338 100%);
      color: #171412;
      box-shadow: 0 10px 22px rgba(212,176,113,0.22);
      border: 0;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.02);
      color: var(--gold-soft);
      border: 1px solid rgba(212,176,113,0.26);
      box-shadow: inset 0 0 0 1px rgba(212,176,113,0.04);
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 8px 14px 12px;
    }

    .footer-left,
    .qr-mini,
    #status-text {
      display: none;
    }

    .share-mark {
      width: 27px;
      height: 27px;
      border-radius: 999px;
      border: 1px solid rgba(212,176,113,0.16);
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 14px;
      flex: 0 0 auto;
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .viewport {
        height: auto;
        min-height: calc(100vh - 20px);
        overflow: auto;
        padding: 16px 12px 14px;
      }
      html, body { overflow: auto; }
      .header h1 { font-size: 23px; }
      .mobile-card { width: 100%; }
      .action-row { grid-template-columns: 1fr; }
      .info-item { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="header">
      <h1>楓根室內裝修設計有限公司</h1>
    </section>

    <section class="service-row" aria-label="服務項目">
      <span>企劃</span>
      <span class="dot">●</span>
      <span>設計</span>
      <span class="dot">●</span>
      <span>施工</span>
    </section>

    <section class="stage">
      <article class="mobile-card" aria-label="數位名片主卡">
        <div class="hero">
          <img src="assets/portrait.jpg" alt="林宗翰形象照" />
        </div>

        <div class="card-body">
          <div class="hero-copy">
            <div class="role">執行長</div>
            <h2 class="name">林宗翰</h2>
          </div>

          <div class="info-list">
            <div class="info-item"><div class="pill"></div><div>高雄市楠梓區清成街 31 號</div></div>
            <div class="info-item"><div class="pill"></div><div>fenggen.iris@msa.hinet.net</div></div>
            <div class="info-item"><div class="pill"></div><div>07-3553026 #18 ／ 0963-620715</div></div>
          </div>

          <div class="action-row">
            <a class="btn btn-primary" id="line-link" href="https://line.me/ti/p/k7EfqeX8x3" target="_blank" rel="noreferrer">加 LINE 聯繫</a>
            <a class="btn btn-secondary" id="website-link" href="http://www.fenggen.com.tw/" target="_blank" rel="noreferrer">官方網站</a>
          </div>
        </div>

        <div class="card-footer">
          <div class="footer-left">
            <div class="qr-mini"></div>
            <span id="status-text"></span>
          </div>
          <div class="share-mark">↗</div>
        </div>
      </article>
    </section>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    window.CARD_CONFIG = {
      liffId: "2010316548-ci9nYsou",
      lineUrl: "https://line.me/ti/p/k7EfqeX8x3",
      websiteUrl: "http://www.fenggen.com.tw/",
      shareTargetUrl: window.location.href
    };

    (async function initCard() {
      const cfg = window.CARD_CONFIG;
      const lineLink = document.getElementById('line-link');
      const websiteLink = document.getElementById('website-link');

      if (cfg.lineUrl) lineLink.href = cfg.lineUrl;
      if (cfg.websiteUrl) websiteLink.href = cfg.websiteUrl;

      if (!cfg.liffId) return;

      try {
        await liff.init({ liffId: cfg.liffId });
      } catch (error) {
        console.error('LIFF init failed:', error);
      }
    })();
  </script>
</body>
</html>
